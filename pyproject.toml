[project]
name = "coronavirus-structural-task-force"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.3",
    "auspex",
    "bio>=1.8.3",
    "cctbx>=2025.11",
    "gemmi>=0.7.5",
    "grequests>=0.7.0",
    "matplotlib>=3.10.8",
    "mpi4py>=4.1.2",
    "mpl-scatter-density>=0.8",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "rcsb-api>=1.7.3",
    "regex>=2025.11.3",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib-inline>=0.2.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
docs = [
    "myst-parser>=4.0.1",
    "sphinx>=8.1.3",
    "sphinx-autodoc-typehints>=3.0.1",
    "sphinx-copybutton>=0.5.2",
    "sphinx-rtd-theme>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cstf"]

[tool.uv.sources]
auspex = { git = "https://github.com/YunyunGao/AUSPEX.git" }
